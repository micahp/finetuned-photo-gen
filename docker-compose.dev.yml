# Development Docker Compose configuration
# Use: docker compose -f docker-compose.dev.yml up
# This provides hot reloading and development optimizations

version: '3.8'

services:
  app:
    build:
      context: .
      target: dev  # Uses the dev stage from Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    ports:
      - "3000:3000"  # Dev port
    env_file:
      # Pull in all development secrets from the same .env file we use with `npm run dev`
      - .env
    environment:
      - NODE_ENV=development
      # Override DB host to talk to host machine Postgres
      - DATABASE_URL=postgresql://micah:${POSTGRES_PASSWORD}@host.docker.internal:5432/finetuned_image_gen?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-key}
      - NEXT_PUBLIC_GA_TRACKING_ID=${NEXT_PUBLIC_GA_TRACKING_ID:-}
      # Forward frequently-used API keys (comment out if not needed in your setup)
      - STRIPE_API_TOKEN=${STRIPE_API_TOKEN:-}
      - STRIPE_PUBLISHABLE_TOKEN=${STRIPE_PUBLISHABLE_TOKEN:-}
      - FAL_API_TOKEN=${FAL_API_TOKEN:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
    volumes:
      - .:/app            # hot-reload source
      - /app/node_modules # ignore host node_modules
      - /app/.next        # ignore .next build cache
    extra_hosts:
      # ensures host.docker.internal also works on modern Linux
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # Lightweight container that runs network diagnostics before/alongside the app.
  diagnostics:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "▶ DNS check — registry.npmjs.org" && \
      getent hosts registry.npmjs.org || true && \
      echo "▶ HTTPS HEAD request to registry" && \
      apk add --no-cache curl npm >/dev/null && \
      curl -I --max-time 10 https://registry.npmjs.org/ || true && \
      echo "▶ npm ping registry" && \
      npm ping --registry https://registry.npmjs.org/ || true && \
      echo "▶ npm proxy config" && \
      npm config get https-proxy && npm config get proxy && \
      echo "✅ Diagnostics complete. Container will now idle (Ctrl+C to stop)." && \
      tail -f /dev/null
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 